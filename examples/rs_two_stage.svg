<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="290" viewBox="0 0 500 290" class="WaveDrom">
  <!--Synthetic WaveDrom-compatible regression example. See examples/README.md.-->
  <style>text{font:14px sans-serif}.info{fill:#0041c4}.muted{fill:#aaa}.wave{fill:none;stroke:#000;stroke-width:1}</style>
  <defs>
    <g id="000">
